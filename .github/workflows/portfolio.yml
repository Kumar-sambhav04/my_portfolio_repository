name: Portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests have read-only access. Only the deployment job can publish.
permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the proposed version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test publishing safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Validate source and JavaScript syntax
        run: python3 scripts/check_site.py dist --javascript
      - name: Resolve the configured production address
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build the deployable site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build_site.py --url "$SITE_URL" --commit "$GITHUB_SHA"
      - name: Upload the checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Publish portfolio
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure this is still the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          test "$latest_sha" = "$GITHUB_SHA"
      - name: Publish the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    name: Verify live deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the live commit and public files
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/verify_deployment.py --url "$SITE_URL" --commit "$GITHUB_SHA"
